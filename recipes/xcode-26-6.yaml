# The published xcode-26-6 image: what a CI job that builds an iOS app needs.
#
#   phantom image build -f recipes/xcode-26-6.yaml
#
# Layered onto the base image rather than installed from scratch — macOS, the
# agent and provisioning are already in tahoe-base, so this is minutes of
# decompression instead of an hour of installing.
schema: 1
name: xcode-26-6
description: macOS 26 + Xcode 26.6 (17F113) + all simulator runtimes
from: tahoe-base

steps:
  # macOS ships no JavaScript runtime. Baking one in means a step — or a CI job
  # — can be TypeScript instead of shell, without 90MB of download first.
  #
  # Through mise, which tahoe-base carries, and as admin, because that is who
  # mise is installed for and who CI jobs run as. Steps otherwise run as root,
  # whose home is 0700 — tools installed there would be invisible to a job.
  - name: bun
    run: su - admin -c 'mise use --global bun@1.3.14'
    timeout: 10m

  # Then the runner, because it is a 60MB download that fails in seconds —
  # finding out after three hours of Xcode install would be a waste of an
  # afternoon.
  #
  # Every image CI runs on needs this: GitLab's custom executor runs *every*
  # stage inside the job environment, so a job declaring artifacts: or cache:
  # shells out to `gitlab-runner artifacts-uploader` in the guest. Without the
  # binary there the stage prints a warning, the job still passes, and the
  # artifact never arrives.
  - name: gitlab-runner
    script: ../provision/install-gitlab-runner.sh
    env:
      RUNNER_VERSION: v18.11.2
    timeout: 15m

  # Apple requires a login to download Xcode, so this cannot be a public URL —
  # it points at the build network's own copy, which the guest fetches itself
  # over the NAT bridge. No 10GB detour through the host, and `xip --expand`
  # verifies Apple's signature on the way in.
  #
  # The URL is where the exact build (17F113) is written down: change it and
  # `description` together. Building somewhere without that server? Put the
  # .xip on this Mac and hand it over instead:
  #
  #   serve: ~/Downloads/Xcode-26.6.0+17F113.xip
  #   env: { XCODE_SRC: "${serve}" }
  - name: xcode
    script: ../provision/install-xcode.sh
    env:
      XCODE_SRC: http://192.168.1.127:9001/xcodes/Xcode-26.6.0%2B17F113.xip
    # A ~10GB copy, the xip expansion, first launch, and every simulator
    # runtime — the runtimes are the reason this is measured in hours.
    timeout: 4h

  # The installer takes whatever XCODE_SRC points at, so it cannot know which
  # Xcode this image claims to be — that check belongs here, where the claim is
  # made. grep exits non-zero on a mismatch, which fails the build.
  - name: verify
    run: |
      xcodebuild -version | grep -q 'Xcode 26.6'
      xcrun simctl list runtimes | grep -q iOS
      gitlab-runner --version | grep -q 18.11.2
      su - admin -c 'bun --version' | grep -q 1.3.14
      su - admin -c 'mise --version'
    timeout: 5m
